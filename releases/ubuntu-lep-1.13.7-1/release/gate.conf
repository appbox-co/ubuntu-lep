# Release gate settings for ubuntu-lep 1.13.7-1 (sourced by verify-image.sh
# and builder-release.sh).
GATE_TITLE="ubuntu-lep 1.13.7-1 (Ubuntu 18.04, php7.2 rebuilt from Ubuntu's 7.2.24 source with local patches, nginx + php-fpm)"
GATE_IMAGE_NAME=ubuntu-lep
GATE_TAG=1.13.7-1
# Base = the Dockerfile's last FROM (registry ubuntu-lep:latest, deployed).
GATE_BASE_IMAGE=
GATE_BASE_LAYERS_SHA256=7b44ba4e3e27a4fc66f36c79bee325665ded9bf5256ad6519437bc307bf9d19b

GATE_PHP_SOURCE=php7.2
GATE_PHP_BRANCH=7.2
# Ubuntu's own last public php7.2 for 18.04. Every package must carry the
# local +cylo suffix, and a release image must contain at least one local
# patch (php72-patches/*.patch); a local trial image may have none.
GATE_PHP_LAST_UNPATCHED=7.2.24-0ubuntu0.18.04.17
GATE_PHP_VERSION_SUFFIX=+cylo2
# Every php7.2 package, php7.2 -v and php-fpm7.2 -v must be exactly this
# build (php72-patches/0001-CVE-2026-109618-109619.patch, suffix +cylo2).
GATE_PHP_EXACT_VERSION=7.2.24-0ubuntu0.18.04.17+cylo2
GATE_REQUIRE_LOCAL_PATCHES=1
# Trial images use the release build arguments, so the trial gate is the
# release gate apart from the image name.
GATE_TRIAL_BUILD_ARGS=()
GATE_FPM_BIN=php-fpm7.2
GATE_PHP_DEFAULT_CLI=/usr/bin/php7.2
GATE_SAPI=fpm-fcgi

# 7.2.5 -> 7.2.24 may ship new defaults for PHP's own packaged ini files;
# paths, modes and owners must still match, and nothing else may change.
GATE_IMAGE_CONFIG_ROOTS=(/etc/php /etc/nginx /etc/supervisor /scripts /sources)
GATE_CONTENT_CHANGE_ALLOWED='^/etc/php/7\.2/'

# How the platform runs app 75: init, these volumes (appbinds), port 80.
# The entrypoint posts the install callback once and carries on when it
# fails, so no network is needed.
GATE_RUN_NETWORK=none
GATE_RUN_ENV=()
GATE_VOLUMES=(/home/appbox/config /home/appbox/public_html /home/appbox/logs)
GATE_CONFIG_VOLUMES=(/home/appbox/config)
GATE_DOCROOT=/home/appbox/public_html
GATE_HTTP_PORT=80
GATE_READY_TIMEOUT=900
GATE_RUNTIME_CHECKS=(
    "nginx -t -c /home/appbox/config/nginx/nginx.conf"
    "php-fpm7.2 -t --fpm-config /home/appbox/config/php-fpm/php-fpm.conf"
)
GATE_DB_CHECK=
